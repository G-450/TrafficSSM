# Synthetic Smoke Evaluation Configuration for ST-DSSM
schema_version: "1.0"
mode: "synthetic_smoke"
unit: "mph"
forecast_horizon: 12
cadence_minutes: 5

synthetic_setup:
  samples: 20
  horizons: 12
  sensors: 5

metrics:
  point:
    - "MAE"
    - "RMSE"
    - "MAPE"
  probabilistic:
    - "NLL"
    - "CRPS"
    - "PICP"
    - "MPIW"

intervals:
  primary_level: 0.95
  nominal_levels:
    - 0.50
    - 0.80
    - 0.90
    - 0.95
    - 0.99

plotting:
  dpi: 150
  format: "png"
  save_plots: true
