[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "st-dssm"
version = "0.1.0"
description = "Uncertainty-aware spatial-temporal traffic forecasting with deep state-space models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "h5py>=3.8.0",
    "tables>=3.8.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.2.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[project.scripts]
st-dssm-provenance = "st_dssm.cli.provenance:main"
st-dssm-validate = "st_dssm.cli.validate:main"
st-dssm-preprocess = "st_dssm.cli.preprocess:main"
st-dssm-evaluate = "st_dssm.cli.evaluate:main"
st-dssm-baseline = "st_dssm.cli.baseline:main"
st-dssm-encoder = "st_dssm.cli.encoder:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
